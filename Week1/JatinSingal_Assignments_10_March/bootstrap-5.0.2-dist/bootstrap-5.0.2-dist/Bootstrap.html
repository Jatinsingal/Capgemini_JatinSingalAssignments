<!doctype html>
<html lang="en">
  <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootstrap Layout</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
  <body>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarColor01"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarColor01">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Features</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Pricing</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>

            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                data-bs-toggle="dropdown"
                href="#"
                >Dropdown</a
              >

              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Action</a></li>
                <li><a class="dropdown-item" href="#">Another action</a></li>
                <li><a class="dropdown-item" href="#">Something else</a></li>
              </ul>
            </li>
          </ul>

          <form class="d-flex">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
            />
            <button class="btn btn-secondary" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>

    <div class="container-fluid mt-3">
      <div class="row">
        <div class="col-lg-3">
          <div class="accordion" id="accordionExample">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button"
                  data-bs-toggle="collapse"
                  data-bs-target="#collapseOne"
                >
                  Accordion Item #1
                </button>
              </h2>

              <div id="collapseOne" class="accordion-collapse collapse show">
                <div class="accordion-body">
                  This is the first accordion body.
                </div>
              </div>
            </div>

            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button collapsed"
                  data-bs-toggle="collapse"
                  data-bs-target="#collapseTwo"
                >
                  Accordion Item #2
                </button>
              </h2>

              <div id="collapseTwo" class="accordion-collapse collapse">
                <div class="accordion-body">
                  This is the second accordion body.
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Type</th>
                <th>Heading</th>
                <th>Heading</th>
                <th>Heading</th>
              </tr>
            </thead>

            <tbody>
              <tr class="table-primary">
                <td>Primary</td>
                <td>Data</td>
                <td>Data</td>
                <td>Data</td>
              </tr>

              <tr class="table-success">
                <td>Success</td>
                <td>Data</td>
                <td>Data</td>
                <td>Data</td>
              </tr>

              <tr class="table-danger">
                <td>Danger</td>
                <td>Data</td>
                <td>Data</td>
                <td>Data</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="col-lg-3">
          <button class="btn btn-primary m-1">Primary</button>
          <button class="btn btn-secondary m-1">Secondary</button>
          <button class="btn btn-success m-1">Success</button>
          <button class="btn btn-warning m-1">Warning</button>
          <button class="btn btn-danger m-1">Danger</button>
        </div>
      </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
